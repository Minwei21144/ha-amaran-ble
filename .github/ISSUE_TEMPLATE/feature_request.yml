name: Feature request
description: Propose a fixture, control or reliability improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the workflow or limitation, not only the proposed code.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant fixture model
      placeholder: amaran T2c
  - type: checkboxes
    id: scope
    attributes:
      label: Project boundaries
      options:
        - label: This request does not require publishing Mesh keys or other credentials.
          required: true
